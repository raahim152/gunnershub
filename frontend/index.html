<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gunners Matchday Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hero">
        <div class="hero-content">
            <h1>🔴⚪ Gunners Matchday Hub ⚪🔴</h1>
            <p>Predict the scores. Climb the leaderboard. COYG.</p>
        </div>
    </header>

    <main class="container">
        <nav class="tabs">
            <button class="tab-btn active" onclick="showTab('fixtures')">Fixtures & Predictions</button>
            <button class="tab-btn" onclick="showTab('leaderboard')">Leaderboard</button>
        </nav>

        <!-- FIXTURES TAB -->
        <section id="fixtures-tab" class="tab-content active">
            <div id="fixtures-list">
                <!-- Rendered by app.js -->
            </div>
        </section>

        <!-- LEADERBOARD TAB -->
        <section id="leaderboard-tab" class="tab-content">
    <div class="card">
        <h2>🏆 Fan Leaderboard</h2>
        <p class="muted">Exact score = 3 pts · Correct winner = 1 pt · Wrong = 0 pts</p>
        <table id="leaderboard-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Fan</th>
                    <th>Predictions</th>
                    <th>Points</th>
                </tr>
            </thead>
            <tbody><!-- Rendered by app.js --></tbody>
        </table>
        <div class="admin-tools" style="margin-top: 16px;">
            <button class="btn-admin" onclick="resetDemo()">🔄 Reset Demo Data</button>
        </div>
    </div>
</section>
    </main>

    <footer>
        <p>COYG — Come On You Gunners! | DevOps Lab Project</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
